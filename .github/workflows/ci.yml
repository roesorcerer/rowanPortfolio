name: CI

# Run checks on every pull request into production. Work happens on short
# feature branches that merge straight into production; there is no
# development branch (it was dropped in November 2026, design doc 8.6).
# A push to production runs these checks again in deploy.yml before it
# deploys.
on:
  pull_request:
    branches: [production]

jobs:
  # ---- Backend checks ----
  backend:
    runs-on: ubuntu-latest

    # MongoDB service container for integration tests
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # src/test/setup.ts connects to MONGODB_URI_TEST and refuses to run
          # unless it is set, names a database containing "test", and differs
          # from MONGODB_URI (the guard against wiping a real database).
          # src/config/index.ts still requires MONGODB_URI to exist at import.
          MONGODB_URI: mongodb://localhost:27017/portfolio-ci
          MONGODB_URI_TEST: mongodb://localhost:27017/portfolio-test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d

      - name: Build
        run: npm run build

  # ---- Frontend checks ----
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npx vitest run

      # The image copies scripts/optimize-images.mjs writes are slow to
      # encode (most of a minute) and change only when an image or the
      # script does, so they're kept between runs. The script skips any copy
      # newer than its source, and a restored cache is, so a hit encodes
      # nothing.
      - name: Restore optimized images
        uses: actions/cache@v4
        with:
          path: frontend/public/img
          key: images-${{ hashFiles('frontend/public/assets/**', 'frontend/scripts/optimize-images.mjs') }}

      - name: Build
        run: npm run build

      # Design doc 8.1: public JavaScript at or under 100 KB gzipped per
      # page. Reads the build above; the admin and game chunks are lazy and
      # don't count.
      - name: Bundle budget
        run: npm run check:bundle

      # axe against WCAG 2.2 AA on every public page in both themes, in a
      # real browser over `vite preview` with the API stubbed
      # (e2e/a11y.spec.ts), so neither the backend nor the live API is
      # needed.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility
        run: npm run test:a11y

      # The server bundle the prerender step renders with. Compiling it here
      # catches an import that only breaks outside the browser; rendering is
      # covered by src/entry-server.test.tsx, so CI doesn't depend on the
      # live API.
      - name: Build server bundle
        run: npm run build:ssr

  # ---- Docker build verification ----
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # The backend Dockerfile lives at the repo root and needs the root as
      # its build context, because it copies shared/ alongside backend/.
      # This mirrors what `flyctl deploy` does in deploy.yml.
      - name: Build backend image
        run: docker build -f Dockerfile .

      # Same root context for the frontend image, for the same reason: it
      # imports shared/contracts. frontend/Dockerfile.dockerignore stands in
      # for the root .dockerignore, which excludes frontend/.
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile .
