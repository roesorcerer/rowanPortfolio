name: CI

# Run checks on development branch pushes and PRs to both branches
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, production]

jobs:
  # ---- Backend checks ----
  backend:
    runs-on: ubuntu-latest

    # MongoDB service container for integration tests
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # src/test/setup.ts connects to MONGODB_URI_TEST and refuses to run
          # unless it is set, names a database containing "test", and differs
          # from MONGODB_URI (the guard against wiping a real database).
          # src/config/index.ts still requires MONGODB_URI to exist at import.
          MONGODB_URI: mongodb://localhost:27017/portfolio-ci
          MONGODB_URI_TEST: mongodb://localhost:27017/portfolio-test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d

      - name: Build
        run: npm run build

  # ---- Frontend checks ----
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  # ---- Docker build verification ----
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # The backend Dockerfile lives at the repo root and needs the root as
      # its build context, because it copies shared/ alongside backend/.
      # This mirrors what `flyctl deploy` does in deploy.yml.
      - name: Build backend image
        run: docker build -f Dockerfile .

      - name: Build frontend image
        run: docker build ./frontend
