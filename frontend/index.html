    <script>
      // Paint the right background before React loads. The admin and resume stay light.
      (function () {
        if (/^\/(admin|resume)/.test(location.pathname)) return;
        var theme = "dark";
        try {
          theme =
            localStorage.getItem("portfolio-theme") ||
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
