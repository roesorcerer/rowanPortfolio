server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend container.
    # "backend" is the Docker Compose service name — Docker's internal
    # DNS resolves it to the backend container's IP automatically.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any path that doesn't match a static file
    # gets served index.html, so React Router can handle routing.
    # Without this, refreshing /about would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite includes content hashes
    # in filenames, so cache invalidation is automatic on deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
